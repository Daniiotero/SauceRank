server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/saucerank
    username: postgres
    password: DAniel10
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:SauceRankSecretKey2024EladioCarrionSuperSecureJWTKey123456789}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  security:
    pwned-passwords:
      enabled: true
      timeout-ms: 3000
    rate-limit:
      max-per-window: 10
      window-minutes: 15
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@saucerank.com}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
